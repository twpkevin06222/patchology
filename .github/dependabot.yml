version: 2
updates:
  # GitHub Actions used by the workflows and the test-slide action.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # uv.lock (development environment and CI). Users are not affected: they get
  # whatever their resolver picks within the ranges in pyproject.toml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
